<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="An EasyEDA Pro project goes through epro2kicad and comes out as a KiCad 10 project that KiCad itself has checked">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .t { font-size: 16px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #59636e; }
    .r { font-size: 13.5px; font-weight: 600; }
    .k { font-size: 11px; font-weight: 600; letter-spacing: .08em; fill: #59636e; }
    .card { fill: #f6f8fa; stroke: #d1d9e0; }
    .line { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .ok { fill: #1a7f37; }
    .okt { font-size: 13px; font-weight: 600; fill: #1a7f37; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="k" x="20" y="24">FROM</text>
  <rect class="card" x="20" y="36" width="210" height="178" rx="12"/>
  <path d="M52 66 h34 l14 14 v46 h-48 z" fill="none" stroke="#0969da" stroke-width="2" stroke-linejoin="round"/>
  <path d="M86 66 v14 h14" fill="none" stroke="#0969da" stroke-width="2" stroke-linejoin="round"/>
  <text class="t" x="52" y="158">EasyEDA Pro project</text>
  <text class="s" x="52" y="180">.epro · .epro2 · .zip</text>
  <text class="s" x="52" y="198">every board in it</text>

  <path class="line" d="M240 125 H286" marker-end="url(#a)"/>

  <rect x="296" y="92" width="170" height="66" rx="33" fill="#0969da"/>
  <text x="381" y="122" text-anchor="middle" style="fill:#fff;font-size:16px;font-weight:700">epro2kicad</text>
  <text x="381" y="141" text-anchor="middle" style="fill:#fff;font-size:11.5px;opacity:.9">plain Python 3, no dependencies</text>

  <path class="line" d="M476 125 H522" marker-end="url(#a)"/>

  <text class="k" x="532" y="24">TO</text>
  <rect class="card" x="532" y="36" width="328" height="178" rx="12"/>
  <text class="t" x="552" y="64">KiCad 10 project</text>
  <g>
    <circle cx="558" cy="90" r="4" fill="#0969da"/><text class="r" x="572" y="94.5">Schematic</text><text class="s" x="652" y="94.5">sheets, wires, net names</text>
    <circle cx="558" cy="120" r="4" fill="#0969da"/><text class="r" x="572" y="124.5">PCB</text><text class="s" x="652" y="124.5">copper, pours, silkscreen, stackup</text>
    <circle cx="558" cy="150" r="4" fill="#0969da"/><text class="r" x="572" y="154.5">Libraries</text><text class="s" x="652" y="154.5">symbols, footprints, 3D models</text>
    <circle cx="558" cy="180" r="4" fill="#0969da"/><text class="r" x="572" y="184.5">Rules</text><text class="s" x="652" y="184.5">net classes, clearances, teardrops</text>
  </g>

  <path class="line" d="M696 214 V246" marker-end="url(#a)"/>

  <rect class="card" x="20" y="256" width="840" height="58" rx="12"/>
  <text class="k" x="40" y="290">CHECKED BY KICAD</text>
  <g>
    <path class="ok" d="M196 280 l5 5 l9 -10 l3 3 l-12 13 l-8 -8 z"/><text class="okt" x="220" y="290">ERC</text>
    <path class="ok" d="M278 280 l5 5 l9 -10 l3 3 l-12 13 l-8 -8 z"/><text class="okt" x="302" y="290">DRC</text>
    <path class="ok" d="M360 280 l5 5 l9 -10 l3 3 l-12 13 l-8 -8 z"/><text class="okt" x="384" y="290">schematic nets = PCB nets</text>
  </g>
  <path class="line" d="M596 285 H632" marker-end="url(#a)"/>
  <text class="r" x="644" y="290" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px">conversion-report.md</text>
</svg>
