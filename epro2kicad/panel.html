<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCSC parts</title>
<style>
:root{--bg:#fff;--bg2:#f4f5f7;--bg3:#eceef1;--fg:#1d1f23;--mut:#6b7079;--line:#e4e6ea;--acc:#1f883d;--acc2:#e9f6ec;--accfg:#fff;--link:#0b62c4;--warn:#b54708;--sel:#e8f0fe;--selbar:#2f6fe4;--pv:#fff;--pvfp:#1b1f24;--shadow:0 8px 28px #0002}
@media (prefers-color-scheme:dark){:root{--bg:#1c1d20;--bg2:#24262a;--bg3:#2d3035;--fg:#e9eaec;--mut:#9a9ea6;--line:#34373c;--acc:#2ea043;--acc2:#1d3325;--link:#6cb6ff;--warn:#f0a050;--sel:#22314a;--selbar:#5b9bff;--pv:#f4f4f4;--shadow:0 8px 28px #0008}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.mut{color:var(--mut)}.err{color:var(--warn)}
header{padding:10px 10px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px;position:relative}
.row{display:flex;gap:6px;align-items:center}
.search{flex:1;position:relative;display:flex}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
#q{flex:1;min-width:0;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);transition:border-color .12s,background .12s}
#q:focus{outline:0;border-color:var(--acc);background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap;transition:background .1s,border-color .1s}
.btn:hover{background:var(--bg2)}
.btn.on{background:var(--acc2);border-color:var(--acc);color:var(--fg)}
.primary{background:var(--acc);color:var(--accfg);border:0;border-radius:8px;padding:8px 16px;font-weight:600;cursor:pointer}
.primary:hover{filter:brightness(1.07)}.primary:disabled{opacity:.45;cursor:default;filter:none}
.crumb{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.crumb:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--acc2);border-radius:20px;padding:2px 4px 2px 9px;font-size:12px}
.chip b{font-weight:500;color:var(--mut)}
.chip button{border:0;background:none;cursor:pointer;padding:0 4px;color:var(--mut);font-size:14px;line-height:1;border-radius:50%}
.chip button:hover{color:var(--fg)}
.opts{display:flex;gap:4px;flex-wrap:wrap}
.opts label{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mut);padding:3px 9px;border:1px solid var(--line);border-radius:20px;cursor:pointer;user-select:none}
.opts label:has(input:checked){color:var(--fg);background:var(--bg2)}
.opts input{margin:0;accent-color:var(--acc)}
#bar{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;opacity:0;transition:opacity .15s}
#bar::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:var(--acc);animation:bar 1s ease-in-out infinite}
body.loading #bar{opacity:1}
@keyframes bar{from{left:-30%}to{left:100%}}
main{flex:1;display:flex;min-height:0}
.col{min-height:0;overflow:auto}
#cats{width:210px;border-right:1px solid var(--line);display:none;flex-direction:column;background:var(--bg)}
#cats .list{overflow:auto;flex:1;padding:2px 4px 8px}
#cats input{flex:1;margin:8px 4px 6px 8px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
#cats input:focus{outline:0;border-color:var(--acc)}
.cat{padding:4px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.cat:hover{background:var(--bg2)}.cat.sel{background:var(--sel);font-weight:600}
.sub .cat{padding-left:22px;color:var(--mut)}.sub .cat.sel,.sub .cat:hover{color:var(--fg)}
#results{flex:1;display:flex;flex-direction:column;min-width:0}
#facets{display:flex;gap:8px;overflow-x:auto;padding:8px 8px 6px}#facets:empty{display:none}
body.nofilters #facets{display:none}
.fcol{flex:0 0 190px;min-width:0;width:190px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;height:156px;background:var(--bg)}
.fcol .fh{font-size:11.5px;font-weight:600;padding:5px 8px 3px;display:flex;justify-content:space-between}
.fcol .fh .n{color:var(--selbar)}
.fcol input{margin:0 6px 4px;padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);font-size:12px;min-width:0}
.fcol input:focus{outline:0;border-color:var(--acc)}
.fcol .vals{overflow:auto;flex:1;padding:0 3px 4px}
.fv{padding:2px 6px;border-radius:5px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;user-select:none}
.fv:hover{background:var(--bg2)}.fv.on{background:var(--sel);color:var(--selbar);font-weight:600}
#fbar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
#fbar .grow{flex:1}#fbar{flex-wrap:wrap}
.sortseg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sortseg button{border:0;background:var(--bg);padding:3px 10px;font-size:12px;cursor:pointer;color:var(--mut)}
.sortseg button+button{border-left:1px solid var(--line)}
.sortseg button:hover{background:var(--bg2)}.sortseg button.on{background:var(--acc2);color:var(--fg);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;user-select:none;margin-left:4px}
.switch input{display:none}
.switch span{width:28px;height:16px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);position:relative;transition:background .15s}
.switch span::after{content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0004;transition:left .15s}
.switch input:checked+span{background:var(--acc);border-color:var(--acc)}.switch input:checked+span::after{left:13px}#fbar .btn{font-size:12px;padding:3px 10px}
#fbar .primary{padding:4px 12px;font-size:12px}
#status{padding:5px 10px;color:var(--mut);font-size:12px;border-bottom:1px solid var(--line)}
#list{flex:1;overflow:auto;transition:opacity .15s}
body.dim #list{opacity:.55}
.part{display:grid;grid-template-columns:84px minmax(0,1fr) 140px 112px;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.part:hover{background:var(--bg2)}.part.sel{background:var(--sel);box-shadow:inset 3px 0 var(--selbar)}
.part .img img,.part .noimg{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:6px;display:block}
.noimg{background:var(--bg3)}
.part .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.part .info .mpn{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.part .meta{color:var(--mut);font-size:12px;display:flex;gap:4px 12px;flex-wrap:wrap}
.part .meta b{font-weight:500;color:var(--fg)}
.part .cat2{color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.specs{display:flex;gap:3px;flex-wrap:wrap;max-height:44px;overflow:hidden}
.sp{font-size:11.5px;padding:0 6px;border-radius:5px;background:var(--bg2);border:1px solid var(--line);white-space:nowrap}
.sp:first-child{font-weight:600}
.part .tiers{font-size:12px;font-variant-numeric:tabular-nums;display:grid;grid-template-columns:auto auto;gap:1px 8px;align-content:start;justify-content:start}
.part .tiers span:nth-child(odd){color:var(--mut);text-align:right}.part .tiers span:nth-child(even){color:var(--warn)}
.part .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px}
.part .side .stk{color:var(--mut)}.part .side .stk b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.rowplace{border:0;background:var(--acc);color:var(--accfg);border-radius:7px;padding:5px 18px;font-weight:600;cursor:pointer;margin-top:auto}
.rowplace:hover{filter:brightness(1.07)}.rowplace:disabled{opacity:.4;cursor:default;filter:none}
.lnk{font-size:12px}
.p1{display:none}
#results{container-type:inline-size}
@container (max-width:640px){.part{grid-template-columns:64px minmax(0,1fr) 96px}.part .tiers{display:none}.p1{display:block}.part .img img,.part .noimg{width:64px;height:64px}}
@container (max-width:430px){.part{grid-template-columns:minmax(0,1fr) 88px}.part .img{display:none}}
.mpn{font-weight:600}
.tag{font-size:10.5px;padding:1px 6px;border-radius:9px;background:var(--bg3);color:var(--mut);white-space:nowrap;font-weight:500;vertical-align:1px}
.tag.basic{background:var(--acc2);color:var(--acc)}
.stock0{color:var(--warn)}
.skel{height:105px;margin:0;border-top:1px solid var(--line);background:linear-gradient(90deg,transparent,var(--bg2),transparent) 0 0/200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
#sentinel{height:40px;display:flex;align-items:center;justify-content:center}
#detail{display:none;position:fixed;inset:0;z-index:15;background:#0006;align-items:center;justify-content:center;padding:14px}
body.showdetail #detail{display:flex}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(820px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dhead{padding:10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.dhead .place{border:0;padding:0;background:none}
.dhead .mpn{font-size:15px}
.dbody{flex:1;overflow:auto;padding:10px}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dcols{display:grid;grid-template-columns:1fr 220px;gap:14px}
@media (max-width:640px){.dcols{grid-template-columns:1fr}.pv{grid-template-columns:1fr}}
.pvbox{border:1px solid var(--line);border-radius:10px;height:240px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;cursor:zoom-in}
.pvbox.sym{background:var(--pv)}.pvbox.fp{background:var(--pvfp)}
.pvbox img{max-width:100%;max-height:100%}
.pvbox svg{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pvbox .lbl{position:absolute;left:7px;top:6px;font-size:11px;color:#888;display:flex;gap:5px;align-items:center;z-index:1}
.pvbox.big{position:fixed;inset:12px;height:auto;z-index:20;cursor:zoom-out;box-shadow:var(--shadow)}
.photo{width:100%;max-height:150px;object-fit:contain;background:#fff;border-radius:10px;margin-bottom:10px}
table{border-collapse:collapse;width:100%;margin-bottom:8px}
td{padding:4px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--mut);width:42%}
h4{margin:12px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.place{background:var(--bg);border-top:1px solid var(--line);padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split{position:relative;display:inline-flex}
.split #placebtn{border-radius:8px 0 0 8px;min-width:90px}
.split #placemenu{border-radius:0 8px 8px 0;border-left:1px solid #fff5;padding:8px 9px}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:10;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;min-width:270px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:7px 10px;cursor:pointer}
.menu button:hover{background:var(--bg2)}.menu button small{color:var(--mut);display:block}
.seg{display:inline-flex;border:1px solid #ccc;border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;color:#666;font-size:10.5px;padding:1px 7px;cursor:pointer}.seg button.on{background:#1f883d;color:#fff}
.lbl select{font-size:11px;color:#333;background:#fff;border:1px solid #ccc;border-radius:5px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--mut);border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
/* wide panel: categories beside the list; narrow: categories as overlay */
@media (min-width:900px){#cats{display:flex}#catbtn{display:none}#catclose{display:none}}
@media (max-width:899px){body.showcats #cats{display:flex;position:fixed;inset:0;width:auto;z-index:10;background:var(--bg)}}
</style></head><body>
<header>
 <div class="row">
  <button class="btn" id="catbtn" title="Categories">☰</button>
  <div class="search"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="2"/></svg><input id="q" type="search" placeholder="Search LCSC: C2040, CL10A106, 10uF 0603, ESP32…" autocomplete="off"></div>
 </div>
 <div class="crumb" id="crumb"></div>
 <div class="opts">
  <label><input type="checkbox" id="basic"> JLCPCB basic</label>

 </div>

</header>
<main>
 <section id="cats" class="col">
  <div class="row"><input id="catq" type="search" placeholder="Filter categories" style="flex:1"><button class="btn" id="catclose" title="Close">✕</button></div>
  <div class="list" id="catlist"><div class="cat mut">Loading…</div></div>
 </section>
 <section id="results">
  <div id="fbar" hidden><button class="btn" id="ftoggle"></button>
   <span class="sortseg" id="sort"><button data-s="">Best match</button><button data-s="stock">Stock</button><button data-s="price">Price ↑</button><button data-s="price-desc">Price ↓</button></span>
   <label class="switch"><input type="checkbox" id="stock" checked><span></span>In stock</label>
   <span class="grow"></span><button class="btn" id="fclear">Clear filters</button></div>
  <div id="facets"></div>

 </section>
 <section id="detail">
  <div class="dlg"><div class="dhead"><div style="flex:1;min-width:0"><div class="mpn" id="dtitle">Select a part</div><div class="mut" id="dsub"></div></div>
   <div class="place"><span class="split"><button class="primary" id="placebtn" disabled>Place</button><button class="primary" id="placemenu" disabled aria-label="More placement options" title="Place with KiCad's or EasyEDA's symbol">&#9662;</button><div class="menu" id="pmenu" hidden></div></span></div><button class="btn" id="back" title="Close (Esc)">✕</button></div>
  <div id="pstat" class="mut" style="padding:0 10px"></div>
  <div class="dbody" id="dbody"><p class="mut">Click a part to see its symbol, footprint, specs and prices. Double-click places it.</p></div></div>
 </section>
</main>
<script>
"use strict";
// ---------------- KiCad remote symbol RPC (version 1) ----------------
let session = null, msgId = 0;
const pending = {};
window.kiclient = { postMessage(text) {
  let m; try { m = JSON.parse(text); } catch (e) { return; }
  if (m.command === 'NEW_SESSION' && m.response_to === undefined) { session = m.session_id; return; }
  if (m.error_code === 'SESSION_MISMATCH' && m.session_id) session = m.session_id;  // KiCad's current one (see joinSession)
  const p = pending[m.response_to]; if (!p) return; delete pending[m.response_to];
  m.status === 'OK' ? p.ok(m) : p.fail(Object.assign(new Error(m.error_message || m.error_code || 'KiCad error'), {code: m.error_code}));
}};
function toKicad(text) {
  if (window.kicad && window.kicad.postMessage) return window.kicad.postMessage(text);
  const wk = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kicad;
  if (wk) return wk.postMessage(text);
  if (window.chrome && window.chrome.webview) return window.chrome.webview.postMessage(text);
  throw new Error('Open this page from KiCad: schematic editor → View → Panels → Remote Symbols.');
}
// KiCad sends the session id once per page load, and at its startup that message can reach the page before it is
// ready (lost). Every error reply carries KiCad's current session id, so a message with a made-up id is answered
// with SESSION_MISMATCH and the real one: the page joins the session without a reload.
async function joinSession() {
  if (session) return;
  const id = ++msgId;
  const got = new Promise(ok => { pending[id] = {ok, fail: ok}; setTimeout(ok, 1500); });
  try { toKicad(JSON.stringify({version: 1, session_id: 'join', message_id: id, command: 'GET_KICAD_VERSION', parameters: {}})); }
  catch (e) { delete pending[id]; return; }
  await got; delete pending[id];
}
setTimeout(joinSession, 800);  // KiCad's own handshake normally arrives within milliseconds of the load
async function rpc(command, parameters, data, retried) {
  await joinSession();
  try { return await send(command, parameters, data); }
  catch (e) {  // KiCad started a new session meanwhile: the error told us its id
    if (retried || e.code !== 'SESSION_MISMATCH') throw e;
    return rpc(command, parameters, data, true);
  }
}
function send(command, parameters, data) {
  return new Promise((ok, fail) => {
    if (!session) return fail(new Error('Not connected to KiCad (close and reopen the Remote Symbols panel).'));
    const id = ++msgId; pending[id] = {ok, fail};
    const env = {version: 1, session_id: session, message_id: id, command, parameters: parameters || {}};
    if (data !== undefined) env.data = data;
    try { toKicad(JSON.stringify(env)); } catch (e) { delete pending[id]; fail(e); }
    setTimeout(() => { if (pending[id]) { delete pending[id]; fail(new Error('KiCad did not answer.')); } }, 180000);
  });
}
// ---------------- helpers ----------------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString();
const price = v => '$' + (+v < 1 ? (+v).toFixed(4) : (+v).toFixed(2));
const store = { get(k, d) { try { const v = localStorage.getItem('lcsc.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('lcsc.' + k, JSON.stringify(v)); } catch (e) {} } };
async function getJSON(url, opts) {
  const r = await fetch(url, opts); let j; try { j = await r.json(); } catch (e) { throw new Error('HTTP ' + r.status); }
  if (!r.ok || j.error) throw new Error(j.error || ('HTTP ' + r.status)); return j;
}
function status(html, err) { const s = $('#status'); s.innerHTML = html; s.className = err ? 'err' : ''; }
// ---------------- state ----------------
const st = { sort: store.get('sort', ''), q: '', catalog: '', catName: '', filters: {}, page: 1, total: 0, parts: [], facets: [], seq: 0, sel: null, open: null };
['stock', 'basic', 'placeable', 'm3d'].forEach(k => { $('#' + k).checked = store.get(k, $('#' + k).checked); });
// ---------------- categories ----------------
let tree = [];
async function loadCats() {
  try { tree = await getJSON('/api/categories'); renderCats(); }
  catch (e) { $('#catlist').innerHTML = `<div class="cat err">${esc(e.message)}</div>`; }
}
function renderCats() {
  const f = $('#catq').value.trim().toLowerCase(), open = st.open;
  let h = `<div class="cat ${!st.catalog ? 'sel' : ''}" data-id="" data-name="">All parts</div>`;
  for (const c of tree) {
    const kids = c.children.filter(s => !f || s.name.toLowerCase().includes(f) || c.name.toLowerCase().includes(f));
    if (f && !kids.length && !c.name.toLowerCase().includes(f)) continue;
    const expanded = f || open === c.id || c.children.some(s => String(s.id) === st.catalog);
    h += `<div class="cat ${String(c.id) === st.catalog ? 'sel' : ''}" data-id="${c.id}" data-name="${esc(c.name)}" data-parent="1"><span>${esc(c.name)}</span><span class="mut">${expanded ? '▾' : '▸'}</span></div>`;
    if (expanded) h += '<div class="sub">' + kids.map(s =>
      `<div class="cat ${String(s.id) === st.catalog ? 'sel' : ''}" data-id="${s.id}" data-name="${esc(s.name)}">${esc(s.name)}</div>`).join('') + '</div>';
  }
  $('#catlist').innerHTML = h;
}
$('#catlist').addEventListener('click', e => {
  const el = e.target.closest('.cat'); if (!el || el.dataset.id === undefined) return;
  if (el.dataset.parent && st.open !== Number(el.dataset.id) && !$('#catq').value) { st.open = Number(el.dataset.id); }
  setCategory(el.dataset.id, el.dataset.name);
});
$('#catq').addEventListener('input', renderCats);
// hovering a category starts its search, so the click usually shows it at once
let catT = null;
$('#catlist').addEventListener('mouseover', e => {
  const el = e.target.closest('.cat'); clearTimeout(catT); if (!el || !el.dataset.id) return;
  catT = setTimeout(() => fetch(searchURL(el.dataset.id, {}, 1) + '&pre=1').catch(() => {}), 150);
});
$('#catbtn').onclick = () => document.body.classList.add('showcats');
$('#catclose').onclick = () => document.body.classList.remove('showcats');
function setCategory(id, name) {
  st.catalog = id || ''; st.catName = name || ''; st.filters = {};
  document.body.classList.remove('showcats'); renderCats(); search(1);
}
// ---------------- search ----------------
let timer = null;
$('#q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { st.q = $('#q').value.trim(); search(1); }, 250); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(timer); st.q = $('#q').value.trim(); search(1); } });
['stock', 'basic', 'placeable'].forEach(k => $('#' + k).onchange = () => { store.set(k, $('#' + k).checked); renderList(); });
$('#m3d').onchange = () => store.set('m3d', $('#m3d').checked);
async function search(page, quick) {
  const my = ++st.seq; st.page = page;
  if (page === 1) store.set('last', {q: st.q, cat: st.catalog, catName: st.catName, f: st.filters});  // reopened panel starts here
  renderCrumb();
  if (!st.q && !st.catalog && !(st.filters.Category || []).length) { st.parts = []; st.facets = []; renderFacets(); renderList(); status('Search or pick a category.'); return; }
  // keep the current results on screen (dimmed, progress bar) instead of blanking the list
  document.body.classList.add('loading'); document.body.classList.toggle('dim', page === 1 && !quick);
  if (page === 1 && !st.parts.length) $('#list').innerHTML = '<div class="skel"></div>'.repeat(8);
  if (page === 1 && st.parts.length) status(`${fmt(st.total)} parts · updating…`);
  try {
    const u = searchURL(st.catalog, st.filters, page);
    const r = await getJSON(u);
    if (my !== st.seq) return;
    if (r.catalog && r.catalog !== st.catalog) {  // a Category facet switched us into that category
      st.catalog = r.catalog; st.catName = (st.filters.Category || []).join(', '); delete st.filters.Category; renderCats();
    }
    st.total = r.total; st.facets = r.facets;
    const seen = new Set(page === 1 ? [] : st.parts.map(p => p.code));
    const fresh = r.parts.filter(p => !seen.has(p.code) && seen.add(p.code));
    st.parts = page === 1 ? fresh : st.parts.concat(fresh);
    if (page > 1 && !fresh.length) st.total = st.parts.length;  // nothing new: stop loading more
    renderCrumb(); if (page === 1) renderFacets(); renderList();  // later pages keep half-picked filters
    if (page === 1 && !quick) $('#list').scrollTop = 0;
    if (r.age > 600) refresh(u, my);
    if (st.parts.length < st.total) fetch(searchURL(st.catalog, st.filters, page + 1) + '&pre=1').catch(() => {});  // warm the next page
  } catch (e) { if (my === st.seq) { status(esc(e.message), true); if (!st.parts.length) $('#list').innerHTML = ''; } }
  if (my === st.seq) {
    document.body.classList.remove('loading', 'dim');
    const m = $('#sentinel'); if (m) { more.unobserve(m); more.observe(m); }  // still in view (e.g. all hidden by "In stock"): load on
  }
}
// an answer from the cache is shown at once; this brings its stock and prices up to date without moving the list
async function refresh(u, my) {
  try {
    const r = await getJSON(u + '&fresh=1');
    if (my !== st.seq) return;
    const now = new Map(r.parts.map(p => [p.code, p]));
    st.parts = st.parts.map(p => now.has(p.code) ? Object.assign(p, {stock: now.get(p.code).stock, prices: now.get(p.code).prices, cls: now.get(p.code).cls}) : p);
    const top = $('#list').scrollTop; renderList(); $('#list').scrollTop = top;
  } catch (e) {}
}

  for (const [k, vs] of Object.entries(st.filters)) for (const v of vs)
    chips.push(`<span class="chip"><b>${esc(k)}</b> ${esc(v)}<button data-k="${esc(k)}" data-v="${esc(v)}">×</button></span>`);
  if (chips.length > 1) chips.push('<button class="btn" data-k="__all" style="padding:1px 8px;font-size:12px">clear all</button>');

// numeric-aware sort: 100nF before 1uF, 6.3V before 10V

  if (P.get('cat')) { st.catalog = P.get('cat'); for (const c of tree) for (const x of [c, ...c.children]) if (String(x.id) === st.catalog) st.catName = x.name; renderCats(); }
  try { st.filters = JSON.parse(P.get('f') || '{}'); } catch (e) {}
  if (P.get('q')) { st.q = P.get('q'); $('#q').value = st.q; }
  const last = !location.search && store.get('last', null);  // the panel opens where it was left
  if (last) { st.q = last.q || ''; $('#q').value = st.q; st.catalog = last.cat || ''; st.catName = last.catName || ''; st.filters = last.f || {}; renderCats(); }
  if (st.q || st.catalog) await search(1);
  const code = P.get('code'); if (code) openDetail(st.parts.find(p => p.code === code) || {code, mpn: code, manufacturer: '', url: '', prices: [], placeable: true});
})();
$('#q').focus();
</script></body></html>
