<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LCSC parts</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--bg2:#f5f5f6;--bg3:#ebebed;--fg:#1d1d1f;--mut:#6b6b70;--line:#e2e2e5;--acc:#1f883d;--acc2:#e7f5ea;--accfg:#fff;--link:#0b62c4;--warn:#a84a00;--err:#c0392b;--errbg:#fdecea;--sel:#dce8fc;--selbar:#2f6fe4;--pv:#fff;--pvfp:#1b1f24;--shadow:0 8px 28px #0003}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1f;--bg2:#28282a;--bg3:#343437;--fg:#e9e9eb;--mut:#9c9ca2;--line:#3a3a3e;--acc:#2ea043;--acc2:#1d3325;--link:#6cb6ff;--warn:#f0a050;--err:#ff8a7a;--errbg:#3a2220;--sel:#25354f;--selbar:#5b9bff;--pv:#f2f2f2;--shadow:0 8px 28px #0009}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.mut{color:var(--mut)}.err{color:var(--err)}.warn{color:var(--warn)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--selbar);outline-offset:1px}
header{padding:8px 8px 6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;position:relative}
.row{display:flex;gap:6px;align-items:center}
.search{flex:1;position:relative;display:flex}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
#q{flex:1;min-width:0;padding:7px 10px 7px 31px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);font-size:14px}
#q:focus{outline:0;border-color:var(--selbar);background:var(--bg);box-shadow:0 0 0 3px color-mix(in srgb,var(--selbar) 22%,transparent)}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--bg2)}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:2px 9px;font-size:12px}
.btn.on{background:var(--sel);border-color:var(--selbar)}
.primary{background:var(--acc);color:var(--accfg);border:0;border-radius:7px;padding:7px 16px;font-weight:600;cursor:pointer}
.primary:hover{filter:brightness(1.07)}.primary:disabled{opacity:.45;cursor:default;filter:none}
.tools{display:flex;gap:4px 12px;align-items:center;flex-wrap:wrap;font-size:12px}
.tools .grow{flex:1}
.tgl{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}
.tgl input{margin:0;accent-color:var(--acc)}
.tools select{font-size:12px;padding:1px 2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);max-width:150px}
.crumb{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.crumb:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--sel);border-radius:20px;padding:1px 3px 1px 9px;font-size:12px;max-width:100%}
.chip b{font-weight:500;color:var(--mut)}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{border:0;background:none;cursor:pointer;padding:0 5px;color:var(--mut);font-size:15px;line-height:1.2;border-radius:50%}
.chip button:hover{color:var(--fg);background:var(--bg3)}
#bar{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden;opacity:0;transition:opacity .15s}
#bar::after{content:"";position:absolute;top:0;bottom:0;width:30%;background:var(--selbar);animation:bar 1s ease-in-out infinite}
body.loading #bar{opacity:1}
@keyframes bar{from{left:-30%}to{left:100%}}
main{flex:1;display:flex;min-height:0}
#cats{width:204px;flex:none;border-right:1px solid var(--line);display:none;flex-direction:column;background:var(--bg);min-height:0}
#cats .list{overflow:auto;flex:1;padding:2px 4px 8px}
#cats input{flex:1;min-width:0;margin:6px 4px 5px 6px;padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg2);font-size:12px}
#cats input:focus{outline:0;border-color:var(--selbar)}
.cat{padding:3px 8px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.cat:hover{background:var(--bg2)}.cat.sel{background:var(--sel);font-weight:600}
.sub .cat{padding-left:20px;color:var(--mut);font-size:12.5px}.sub .cat.sel,.sub .cat:hover{color:var(--fg)}
#results{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#facets{display:flex;gap:6px;overflow-x:auto;padding:6px 8px 4px;flex:none}#facets:empty{display:none}
body.nofilters #facets{display:none}
.fcol{flex:0 0 170px;width:170px;border:1px solid var(--line);border-radius:7px;display:flex;flex-direction:column;height:142px;background:var(--bg)}
.fcol.has{border-color:var(--selbar)}
.fcol .fh{font-size:11.5px;font-weight:600;padding:4px 4px 2px 8px;display:flex;justify-content:space-between;gap:4px;align-items:center}
.fcol .fh span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcol .fh button{border:0;background:var(--sel);color:var(--selbar);border-radius:9px;font-size:11px;font-weight:600;padding:0 6px;cursor:pointer;white-space:nowrap}
.fcol input{margin:0 5px 3px;padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg2);font-size:12px;min-width:0}
.fcol input:focus{outline:0;border-color:var(--selbar)}
.fcol .vals{overflow:auto;flex:1;padding:0 3px 3px}
.fv{padding:1px 6px;border-radius:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;user-select:none;-webkit-user-select:none}
.fv:hover{background:var(--bg2)}.fv.on{background:var(--sel);color:var(--selbar);font-weight:600}
#status{padding:4px 10px;color:var(--mut);font-size:12px;border-bottom:1px solid var(--line);flex:none}
#status b{color:var(--fg);font-weight:600}
#list{flex:1;overflow:auto;transition:opacity .15s;outline:0;overscroll-behavior:contain}
body.dim #list{opacity:.5}
.part{display:grid;grid-template-columns:56px minmax(0,1fr) 128px 118px;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;scroll-margin:4px 0}
.part:hover{background:var(--bg2)}.part.sel{background:var(--sel);box-shadow:inset 3px 0 var(--selbar)}
.part .img{width:56px;height:56px;border-radius:5px;background:var(--bg3);overflow:hidden}
.part .img img{width:56px;height:56px;object-fit:contain;background:#fff;display:block}
.part .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.l1{display:flex;gap:6px;align-items:baseline;min-width:0}
.mpn{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2{color:var(--mut);font-size:12px;display:flex;gap:0 10px;flex-wrap:wrap;max-height:17px;overflow:hidden}
.l2 b{font-weight:500;color:var(--fg)}
.l2 .pkg{color:var(--fg)}
.specs{display:flex;gap:3px;flex-wrap:wrap;max-height:19px;overflow:hidden}
.sp{font-size:11.5px;padding:0 6px;border-radius:4px;background:var(--bg2);border:1px solid var(--line);white-space:nowrap;line-height:17px}
.part.sel .sp,.part:hover .sp{background:var(--bg)}
.sp:first-child{font-weight:600}
.sum{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiers{font-size:12px;font-variant-numeric:tabular-nums;display:grid;grid-template-columns:auto auto;gap:0 8px;align-content:start;justify-content:end}
.tiers span:nth-child(odd){color:var(--mut);text-align:right}
.tiers span:nth-child(2){font-weight:600}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:12px;min-width:0}
.stk{font-variant-numeric:tabular-nums;white-space:nowrap}.stk.none{color:var(--warn)}
.p1{display:none;font-variant-numeric:tabular-nums;font-weight:600}
.rowplace{border:0;background:var(--acc);color:var(--accfg);border-radius:6px;padding:3px 16px;font-weight:600;cursor:pointer;margin-top:auto;font-size:12.5px}
.rowplace:hover{filter:brightness(1.07)}.rowplace:disabled{opacity:.4;cursor:default;filter:none}
.nosym{margin-top:auto;color:var(--mut);font-size:11.5px}
.tag{font-size:10.5px;padding:0 6px;border-radius:9px;background:var(--bg3);color:var(--mut);white-space:nowrap;font-weight:500;flex:none}
.tag.basic{background:var(--acc2);color:var(--acc)}
#results.narrow .part{grid-template-columns:48px minmax(0,1fr) 96px}
#results.narrow .tiers{display:none}#results.narrow .p1{display:block}
#results.narrow .part .img,#results.narrow .part .img img{width:48px;height:48px}
#results.tiny .part{grid-template-columns:minmax(0,1fr) 88px}#results.tiny .part .img{display:none}
#results.narrow .fcol{height:112px;flex-basis:150px;width:150px}
.skel{height:71px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,var(--bg2),transparent) 0 0/200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{padding:34px 18px;text-align:center;color:var(--mut);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty h3{margin:0;font-size:14px;font-weight:600;color:var(--fg)}
.empty p{margin:0;max-width:440px}
.empty.bad h3{color:var(--err)}
kbd{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;padding:0 4px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;background:var(--bg2);color:var(--fg)}
#tail{min-height:1px;padding:0 12px;display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mut);font-size:12px;text-align:center}
#tail:not(:empty){padding:10px 12px 14px}
#detail{display:none;position:fixed;inset:0;z-index:15;background:#0006;align-items:center;justify-content:center;padding:12px}
body.showdetail #detail{display:flex}
.dlg{background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(820px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dhead{padding:8px 8px 8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.dhead .mpn{font-size:15px}
#dsub{font-size:12px;display:flex;gap:0 10px;flex-wrap:wrap}
.dbody{flex:1;overflow:auto;padding:10px}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dcols{display:grid;grid-template-columns:1fr 210px;gap:14px}
.pvbox{border:1px solid var(--line);border-radius:8px;height:230px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.pvbox.has{cursor:zoom-in}
.pvbox.sym{background:var(--pv);color:#666}.pvbox.fp{background:var(--pvfp);color:#9aa}
.pvbox svg{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pvbox .lbl{position:absolute;left:7px;top:6px;font-size:11px;color:#888;display:flex;gap:5px;align-items:center;z-index:1}
.pvbox.big{position:fixed;inset:12px;height:auto;z-index:20;cursor:zoom-out;box-shadow:var(--shadow)}
.photo{width:100%;max-height:150px;object-fit:contain;background:#fff;border-radius:8px;margin-bottom:8px}
table{border-collapse:collapse;width:100%;margin-bottom:8px}
td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
td:first-child{color:var(--mut);width:42%}
h4{margin:10px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
h4:first-child{margin-top:0}
.split{position:relative;display:inline-flex;flex:none}
.split #placebtn{border-radius:7px 0 0 7px;min-width:84px}
.split #placemenu{border-radius:0 7px 7px 0;border-left:1px solid #fff5;padding:7px 8px}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:10;background:var(--bg);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:4px;min-width:270px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
.menu button:hover{background:var(--bg2)}.menu button small{color:var(--mut);display:block}
.seg{display:inline-flex;border:1px solid #ccc;border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;color:#666;font-size:10.5px;padding:1px 7px;cursor:pointer}.seg button.on{background:#1f883d;color:#fff}
.lbl select{font-size:11px;color:#333;background:#fff;border:1px solid #ccc;border-radius:5px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;opacity:.7;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;max-width:min(560px,calc(100% - 24px));background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--selbar);border-radius:9px;box-shadow:var(--shadow);padding:9px 10px 9px 12px;display:flex;gap:9px;align-items:flex-start}
#toast.ok{border-left-color:var(--acc)}#toast.bad{border-left-color:var(--err);background:var(--errbg)}
#toast .msg{flex:1;min-width:0;overflow-wrap:anywhere}#toast small{display:block;color:var(--mut);margin-top:3px}
#toast button{border:0;background:none;cursor:pointer;color:var(--mut);font-size:15px;line-height:1;padding:1px 4px}
/* wide panel: categories beside the list, and the part's details docked at the right instead of covering it */
@media (min-width:860px){#cats{display:flex}#catbtn{display:none}#catclose{display:none}}
@media (max-width:859px){body.showcats #cats{display:flex;position:fixed;inset:0;width:auto;z-index:12}}
@media (min-width:1040px){
 #detail{position:static;inset:auto;background:none;padding:0;width:42%;max-width:520px;min-width:390px;flex:none;border-left:1px solid var(--line);align-items:stretch}
 .dlg{border:0;border-radius:0;box-shadow:none;width:100%}
 .pvbox{height:190px}
 .dcols{grid-template-columns:1fr}
 .photo{max-height:110px}
}
@media (max-width:640px){.dcols{grid-template-columns:1fr}.pv{grid-template-columns:1fr}.pvbox{height:190px}}
</style></head><body>
<header>
 <div class="row">
  <button class="btn" id="catbtn" title="Categories" aria-label="Categories">☰</button>
  <div class="search"><svg width="14" height="14" viewBox="0 0 16 16"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="2"/></svg><input id="q" type="search" placeholder="Search LCSC: C2040, CL10A106, 10uF 0603, ESP32…" aria-label="Search LCSC parts" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" autofocus></div>
 </div>
 <div class="tools">
  <label class="tgl" title="Hide parts LCSC has none of right now"><input type="checkbox" id="stock" checked>In stock</label>
  <label class="tgl" title="Only JLCPCB basic parts (no extended-part fee in assembly)"><input type="checkbox" id="basic">Basic</label>
  <label class="tgl" title="Only parts with an EasyEDA symbol and footprint, i.e. the ones that can be placed"><input type="checkbox" id="placeable" checked>Placeable</label>
  <select id="sort" title="Sort order" aria-label="Sort order"><option value="">Best match</option><option value="stock">Most in stock</option><option value="price">Lowest price</option><option value="price-desc">Highest price</option></select>
  <button class="btn sm" id="ftoggle" hidden></button>
  <span class="grow"></span>
  <label class="tgl" title="Download the 3D model (STEP) along with every part you place"><input type="checkbox" id="m3d" checked>Place with 3D model</label>
 </div>
 <div class="crumb" id="crumb"></div>
 <div id="bar"></div>
</header>
<main>
 <section id="cats">
  <div class="row"><input id="catq" type="search" placeholder="Filter categories" aria-label="Filter categories" autocomplete="off" spellcheck="false"><button class="btn sm" id="catclose" title="Close" style="margin-right:6px">✕</button></div>
  <div class="list" id="catlist"><div class="cat mut">Loading…</div></div>
 </section>
 <section id="results">
  <div id="facets"></div>
  <div id="status" hidden></div>
  <div id="list" tabindex="-1"></div>
 </section>
 <section id="detail">
  <div class="dlg"><div class="dhead"><div style="flex:1;min-width:0"><div class="mpn" id="dtitle"></div><div class="mut" id="dsub"></div></div>
   <span class="split"><button class="primary" id="placebtn" disabled title="Place this part in the schematic (Enter)">Place</button><button class="primary" id="placemenu" disabled aria-label="More placement options" title="Place with KiCad's or EasyEDA's symbol">&#9662;</button><div class="menu" id="pmenu" hidden></div></span>
   <button class="btn" id="back" title="Close (Esc)" aria-label="Close">✕</button></div>
  <div class="dbody" id="dbody"></div></div>
 </section>
</main>
<div id="toast" hidden role="status" aria-live="polite"></div>
<script>
"use strict";
// ---------------- KiCad remote symbol RPC (version 1) ----------------
let session = null, msgId = 0;
const pending = {};
window.kiclient = { postMessage(text) {
  let m; try { m = JSON.parse(text); } catch (e) { return; }
  if (m.command === 'NEW_SESSION' && m.response_to === undefined) { session = m.session_id; return; }
  if (m.error_code === 'SESSION_MISMATCH' && m.session_id) session = m.session_id;  // KiCad's current one (see joinSession)
  const p = pending[m.response_to]; if (!p) return; delete pending[m.response_to];
  m.status === 'OK' ? p.ok(m) : p.fail(Object.assign(new Error(m.error_message || m.error_code || 'KiCad error'), {code: m.error_code}));
}};
function toKicad(text) {
  if (window.kicad && window.kicad.postMessage) return window.kicad.postMessage(text);
  const wk = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kicad;
  if (wk) return wk.postMessage(text);
  if (window.chrome && window.chrome.webview) return window.chrome.webview.postMessage(text);
  throw new Error('Open this page from KiCad: schematic editor → View → Panels → Remote Symbols.');
}
// KiCad sends the session id once per page load, and at its startup that message can reach the page before it is
// ready (lost). Every error reply carries KiCad's current session id, so a message with a made-up id is answered
// with SESSION_MISMATCH and the real one: the page joins the session without a reload.
async function joinSession() {
  if (session) return;
  const id = ++msgId;
  const got = new Promise(ok => { pending[id] = {ok, fail: ok}; setTimeout(ok, 1500); });
  try { toKicad(JSON.stringify({version: 1, session_id: 'join', message_id: id, command: 'GET_KICAD_VERSION', parameters: {}})); }
  catch (e) { delete pending[id]; return; }
  await got; delete pending[id];
}
setTimeout(joinSession, 800);  // KiCad's own handshake normally arrives within milliseconds of the load
async function rpc(command, parameters, data, retried) {
  await joinSession();
  try { return await send(command, parameters, data); }
  catch (e) {  // KiCad started a new session meanwhile: the error told us its id
    if (retried || e.code !== 'SESSION_MISMATCH') throw e;
    return rpc(command, parameters, data, true);
  }
}
function send(command, parameters, data) {
  return new Promise((ok, fail) => {
    if (!session) return fail(new Error('Not connected to KiCad (close and reopen the Remote Symbols panel).'));
    const id = ++msgId; pending[id] = {ok, fail};
    const env = {version: 1, session_id: session, message_id: id, command, parameters: parameters || {}};
    if (data !== undefined) env.data = data;
    try { toKicad(JSON.stringify(env)); } catch (e) { delete pending[id]; fail(e); }
    setTimeout(() => { if (pending[id]) { delete pending[id]; fail(new Error('KiCad did not answer.')); } }, 180000);
  });
}
// ---------------- helpers ----------------
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-US');
const price = v => '$' + (+v < 1 ? (+v).toFixed(4) : (+v).toFixed(2));
const ago = s => s < 5400 ? Math.max(1, Math.round(s / 60)) + ' min' : s < 129600 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' days';
const store = { get(k, d) { try { const v = localStorage.getItem('lcsc.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem('lcsc.' + k, JSON.stringify(v)); } catch (e) {} } };
// Answers of the provider. signal: the caller gave up on it (a newer search); timeout: nobody answers.
// Errors say what happened in the user's words (kind: offline | timeout | lcsc | down | http).
async function getJSON(url, o = {}) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), o.timeout || 45000);
  const give = () => c.abort();
  if (o.signal) { if (o.signal.aborted) c.abort(); else o.signal.addEventListener('abort', give); }
  let r;
  try { r = await fetch(url, {method: o.method || 'GET', signal: c.signal}); }
  catch (e) {
    if (o.signal && o.signal.aborted) throw Object.assign(new Error('superseded'), {name: 'AbortError'});
    if (c.signal.aborted) throw Object.assign(new Error('No answer after ' + Math.round((o.timeout || 45000) / 1000) + ' s.'), {kind: 'timeout'});

    if (st.sort && !st.catalog) h += ' · sorted among the loaded parts (pick a category to sort all)';
    if (st.stale) h += ` · <span class="warn">saved ${ago(st.stale)} ago: LCSC can't be reached</span> · <a href="#" data-act="retry">retry</a>`;
  }
  $('#status').innerHTML = h; $('#status').hidden = !h;
}
// The next page loads when the end of the list is some 15 rows away, so scrolling rarely catches up with it (and
// nothing is asked of LCSC for a list nobody scrolls). Pauses after three pages that showed nothing new.
const more = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting) && !st.moreError && st.idleRun < 3) loadMore(); }, {root: $('#list'), rootMargin: '1100px'});
function act(a) {
  if (a === 'retry') search();
  else if (a === 'more') { st.idleRun = 0; st.moreError = null; loadMore(); }
  else if (a === 'showall') { Object.keys(TOGGLES).forEach(k => { $('#' + k).checked = false; store.set(k, false); }); st.idleRun = 0; renderList(); }
  else if (a === 'nofilters') { st.filters = {}; resetDraft(); search(); }
  else if (a === 'nocat') { st.catalog = ''; st.catName = ''; st.filters = {}; resetDraft(); renderCats(); search(); }
}
$('#status').addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (a) { e.preventDefault(); act(a.dataset.act); } });
// resting on a part starts converting it, so its details usually open at once
const warmed = new Set(); let hoverT = null;
function prepare(code, wait) {
  clearTimeout(hoverT);
  if (!code || warmed.has(code)) return;
  hoverT = setTimeout(() => { const p = byCode(code); if (!p || !p.placeable) return; warmed.add(code); quiet('/api/prepare/' + code); }, wait);
}
$('#list').addEventListener('mouseover', e => { const r = e.target.closest('.part'); if (r) prepare(r.dataset.code, 150); });
$('#list').addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (a) { e.preventDefault(); act(a.dataset.act); return; }
  const r = e.target.closest('.part'); if (!r) return;
  const p = byCode(r.dataset.code); if (!p) return;
  if (e.target.closest('.rowplace')) { select(p.code); place(p, store.get('symstyle', 'kicad') === 'easyeda'); return; }
  openDetail(p);
});
// ---------------- selection and keys ----------------
function select(code, scroll) {
  st.sel = code || '';
  $$('.part.sel').forEach(r => r.classList.remove('sel'));
  const row = code && $(`.part[data-code="${CSS.escape(code)}"]`);
  if (row) { row.classList.add('sel'); if (scroll) row.scrollIntoView({block: 'nearest'}); }
  return row;
}
let followT = null;
function move(d) {
  const rows = $$('#list .part'); if (!rows.length) return;
  const i = rows.findIndex(r => r.dataset.code === st.sel);
  const row = rows[Math.max(0, Math.min(rows.length - 1, i < 0 ? (d > 0 ? 0 : rows.length - 1) : i + d))];
  select(row.dataset.code, true);
  if (document.body.classList.contains('showdetail')) {   // open details follow the selection, once it rests
    clearTimeout(followT); followT = setTimeout(() => { const p = byCode(st.sel); if (p) openDetail(p); }, 140);
  } else prepare(row.dataset.code, 250);
}
const detailOpen = () => document.body.classList.contains('showdetail');
function closeDetail() {
  if (!detailOpen()) return;
  clearTimeout(followT); dseq++; st.open = null; st.detail = null;
  document.body.classList.remove('showdetail'); $('#pmenu').hidden = true;
  if (!document.activeElement || document.activeElement === document.body || $('#detail').contains(document.activeElement)) $('#q').focus({preventScroll: true});
}
document.addEventListener('keydown', e => {
  const t = e.target, inQ = t === $('#q'), other = !inQ && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName), mod = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') {
    const big = $('.pvbox.big');
    if (big) big.classList.remove('big');
    else if (!$('#pmenu').hidden) $('#pmenu').hidden = true;
    else if (document.body.classList.contains('showcats')) document.body.classList.remove('showcats');
    else if (detailOpen()) closeDetail();
    else if (other && t.value) return;          // a filter box clears itself
    else if (st.sel) select('');
    else return;                                // nothing of ours to close: the search box's own Esc
    e.preventDefault(); return;
  }
  if (other) return;   // the category / filter boxes keep their keys
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (e.altKey || mod || e.shiftKey) return; e.preventDefault(); move(e.key === 'ArrowDown' ? 1 : -1); }
  else if (e.key === 'PageDown' || e.key === 'PageUp') { e.preventDefault(); move((e.key === 'PageDown' ? 1 : -1) * Math.max(1, Math.floor($('#list').clientHeight / 72) - 1)); }
  else if (e.key === 'Enter') {
    if (!inQ && t.closest('button, a, summary')) return;   // that control's own Enter
    e.preventDefault();
    if (inQ && submitQuery()) return;                       // typed something new: search it now
    const sel = byCode(st.sel);
    if (detailOpen() && !mod) { if (st.open && st.open.placeable) place(st.open, useEasyeda(st.detail)); return; }
    if (mod) { const p = (detailOpen() && st.open) || sel || firstRow(); if (p && p.placeable) { select(p.code, true); place(p, store.get('symstyle', 'kicad') === 'easyeda'); } return; }
    const p = sel || firstRow(); if (p) openDetail(p);
  }
  else if ((e.key === '/' && !inQ && !mod) || (mod && (e.key === 'f' || e.key === 'k'))) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  else if (!inQ && !mod && !e.altKey && e.key.length === 1 && e.key !== ' ' && !t.closest('button, a')) $('#q').focus();  // typing anywhere goes to the search box
});
function firstRow() { const r = $('#list .part'); return r ? byCode(r.dataset.code) : null; }
// ---------------- detail ----------------
let dseq = 0;
async function openDetail(p) {
  if (detailOpen() && st.open && st.open.code === p.code) { select(p.code, true); return; }
  const my = ++dseq; st.open = p; st.detail = null;
  select(p.code, true);
  document.body.classList.add('showdetail');
  $('#dtitle').textContent = p.mpn; $('#dtitle').title = p.mpn;
  $('#dsub').innerHTML = [`<span>${esc(p.code)}</span>`, p.manufacturer ? `<span>${esc(p.manufacturer)}</span>` : '', p.package ? `<span>${esc(p.package)}</span>` : '',
    p.datasheet ? `<a href="#" data-open="${esc(p.code)}/datasheet">Datasheet</a>` : '', p.url ? `<a href="#" data-open="${esc(p.code)}/lcsc">LCSC page</a>` : ''].join('');
  $('#pmenu').hidden = true; syncPlace();
  const wait = p.placeable ? '<span class="spin"></span>' : '<span>none</span>';
  $('#dbody').innerHTML = `<div class="pv"><div class="pvbox sym"><span class="lbl">symbol</span>${wait}</div><div class="pvbox fp"><span class="lbl">footprint</span>${wait}</div></div>
    <div class="dcols"><div id="dinfo">${p.placeable ? '' : '<p class="mut">LCSC has no EasyEDA symbol and footprint for this part, so it can\'t be placed.</p>'}${rowSpecs(p)}</div>
    <div>${p.image_big ? `<img class="photo" src="${esc(p.image_big)}" alt="" onerror="this.remove()">` : ''}${p.bare ? '' : priceTable(p)}</div></div>`;
  $('#dbody').scrollTop = 0;
  if (!p.placeable) return;
  try {
    const d = await getJSON(`/api/detail/${p.code}?3d=${$('#m3d').checked ? 1 : 0}`, {timeout: 100000});
    if (my !== dseq) return;
    st.detail = d; syncPlace();
    if (p.bare) {   // opened by its number alone: its name comes with the detail
      const sp = Object.fromEntries(d.specs), name = sp['Manufacturer Part'] || p.code;
      $('#dtitle').textContent = $('#dtitle').title = name;
      if (sp.Manufacturer) $('#dsub').insertAdjacentHTML('beforeend', `<span>${esc(sp.Manufacturer)}</span>`);
    }
    $('#dinfo').innerHTML = `<h4>Specs</h4><table>${d.specs.filter(([, v]) => v !== '-').map(([k, v]) => `<tr><td>${esc(k)}</td><td>${k === 'Datasheet' ? `<a href="#" data-open="${esc(d.code)}/datasheet">open</a>` : esc(v)}</td></tr>`).join('')}
      <tr><td>KiCad symbol</td><td>${d.stock ? `standard ${esc(d.stock)} (pins mapped to the pads)` : 'converted from EasyEDA'} · ${d.pins} pins${d.units > 1 ? ' · ' + d.units + ' units' : ''}</td></tr>
      <tr><td>KiCad footprint</td><td>${esc(d.footprint)}</td></tr><tr><td>3D model</td><td>${d.has_3d ? 'yes (STEP)' : 'no'}</td></tr></table>`;
    symPreview(p, d, my);
    loadSvg($('.pvbox.fp'), `/preview/${p.code}/footprint.svg`, my, 'footprint');
  } catch (e) {
    if (my !== dseq) return;
    $$('.pvbox .spin').forEach(s => s.replaceWith(Object.assign(document.createElement('span'), {textContent: 'no preview'})));
    $('#dinfo').insertAdjacentHTML('afterbegin', `<p class="err" title="${esc(e.detail || '')}">This part couldn't be prepared: ${esc(e.message)} <button class="btn sm" id="dretry">Try again</button></p>`);
    $('#dretry').onclick = () => { const q = st.open; st.open = null; if (q) openDetail(q); };
  }
}
// what the result list already knows, shown until (and unless) the part's own data arrives
function rowSpecs(p) {
  const rows = (p.specs || []).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  return rows || p.summary ? `<h4>Specs</h4>${rows ? `<table>${rows}</table>` : `<p>${esc(p.summary)}</p>`}` : '';
}
// symbol preview: KiCad's standard drawing or EasyEDA's (the choice is remembered and is what Place uses)
function useEasyeda(d) { return !!(d && d.stock && store.get('symstyle', 'kicad') === 'easyeda'); }
function symPreview(p, d, my) {
  const ez = useEasyeda(d), n = ez ? d.units_easyeda : d.units, v = ez ? '&v=easyeda' : '';
  const units = n > 1 ? `<select id="unit" aria-label="Unit">${Array.from({length: n}, (_, i) => `<option value="${i + 1}">unit ${String.fromCharCode(65 + i)}</option>`).join('')}</select>` : '';
  const seg = d.stock ? `<span class="seg"><button data-v="kicad" class="${ez ? '' : 'on'}" title="KiCad standard symbol ${esc(d.stock)}">KiCad</button><button data-v="easyeda" class="${ez ? 'on' : ''}" title="EasyEDA's own symbol">EasyEDA</button></span>` : '';
  const box = $('.pvbox.sym'); if (!box) return;
  box.classList.remove('has', 'big');
  box.innerHTML = `<span class="lbl">symbol${seg} ${units}</span><span class="spin"></span>`;
  loadSvg(box, `/preview/${p.code}/symbol.svg?unit=1${v}`, my, 'symbol');
  box.querySelectorAll('.seg button').forEach(b => b.onclick = e => { e.stopPropagation(); store.set('symstyle', b.dataset.v); symPreview(p, d, my); });
  const u = $('#unit'); if (u) { u.onclick = e => e.stopPropagation(); u.onchange = () => loadSvg(box, `/preview/${p.code}/symbol.svg?unit=${u.value}${v}`, my, 'symbol'); }
}
// kicad-cli draws on a whole page: inline the SVG and crop its viewBox to the drawing. Only the newest request for
// a box may fill it (unit and style switches, another part opened meanwhile).
const svgSeq = {};
async function loadSvg(box, url, my, kind) {
  if (!box) return;
  const mine = svgSeq[kind] = (svgSeq[kind] || 0) + 1, current = () => my === dseq && mine === svgSeq[kind] && box.isConnected;
  const fill = el => { box.querySelectorAll('svg, .spin, .nopv').forEach(x => x.remove()); box.appendChild(el); };
  try {
    const r = await fetch(url); if (!r.ok) throw new Error();
    const doc = new DOMParser().parseFromString(await r.text(), 'image/svg+xml');
    if (!current()) return;
    const svg = document.importNode(doc.documentElement, true);
    if (svg.nodeName.toLowerCase() !== 'svg') throw new Error();
    svg.querySelectorAll('rect').forEach(x => { if (+x.getAttribute('width') > 200) x.remove(); });  // page background
    svg.removeAttribute('width'); svg.removeAttribute('height');
    svg.style.cssText = 'width:100%;height:100%';
    fill(svg); box.classList.add('has');
    const b = svg.getBBox(), m = Math.max(b.width, b.height) * 0.06 + 0.5;
    if (b.width && b.height) svg.setAttribute('viewBox', `${b.x - m} ${b.y - m} ${b.width + 2 * m} ${b.height + 2 * m}`);
  } catch (e) { if (current()) { box.classList.remove('has'); fill(Object.assign(document.createElement('span'), {className: 'nopv', textContent: 'no preview'})); } }
}
function priceTable(p) {
  const head = `<h4>Price (USD) · ${p.stock ? fmt(p.stock) + ' in stock' : 'out of stock'}</h4>`;
  return p.prices.length ? `${head}<table>${p.prices.map(x => `<tr><td>${fmt(x.qty)}+</td><td>${price(x.price)}</td></tr>`).join('')}</table>` : head;
}
$('#dbody').addEventListener('click', e => { const b = e.target.closest('.pvbox'); if (b && b.querySelector('svg') && !e.target.closest('.lbl')) b.classList.toggle('big'); });
$('#back').onclick = closeDetail;
$('#detail').addEventListener('click', e => { if (e.target === $('#detail')) closeDetail(); });
// links open in the system browser (KiCad's panel would open them inside itself)
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-open]'); if (!a) return;
  e.preventDefault();
  quiet('/api/open/' + a.dataset.open, {method: 'POST'});
});
// ---------------- place ----------------
let placing = '', toastT = null, closeHint = false;
function toast(kind, html, sub) {
  clearTimeout(toastT);
  const t = $('#toast'); t.className = kind; t.hidden = false;
  t.innerHTML = `${kind === 'busy' ? '<span class="spin" style="margin-top:2px"></span>' : ''}<div class="msg">${html}${sub ? `<small>${sub}</small>` : ''}</div>${kind === 'busy' ? '' : '<button aria-label="Dismiss" title="Dismiss">×</button>'}`;
  if (kind === 'ok') toastT = setTimeout(() => { t.hidden = true; }, 9000);
}
$('#toast').addEventListener('click', e => { if (e.target.closest('button')) $('#toast').hidden = true; });
// every Place control follows the one placement that may be under way
function syncPlace() {
  const p = st.open, can = !!(p && p.placeable) && !placing;
  $('#placebtn').disabled = $('#placemenu').disabled = !can;
  $('#placebtn').innerHTML = placing && p && placing === p.code ? '<span class="spin"></span>' : 'Place';
  $('#placebtn').title = p && !p.placeable ? 'No EasyEDA symbol and footprint for this part' : 'Place this part in the schematic (Enter)';
  $$('.rowplace').forEach(b => { const code = b.closest('.part').dataset.code; b.disabled = !!placing; b.innerHTML = placing === code ? '<span class="spin"></span>' : 'Place'; });
}
$('#placebtn').onclick = () => place(st.open, useEasyeda(st.detail));
$('#placemenu').onclick = e => {
  e.stopPropagation();
  const m = $('#pmenu'), d = st.detail;
  if (!m.hidden) { m.hidden = true; return; }
  m.innerHTML = d && d.stock
    ? `<button data-ez="0">Place with KiCad symbol<small>standard ${esc(d.stock)}, pins mapped to the pads</small></button>
       <button data-ez="1">Place with EasyEDA symbol<small>the part's own drawing from the EasyEDA library</small></button>`
    : `<button data-ez="1">Place<small>${d ? 'no KiCad standard symbol for this part: EasyEDA\'s drawing' : 'the part is still being prepared'}</small></button>`;
  m.hidden = false;
};
$('#pmenu').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; $('#pmenu').hidden = true; place(st.open, b.dataset.ez === '1'); });
document.addEventListener('click', e => { if (!e.target.closest('.split')) $('#pmenu').hidden = true; });
// One part at a time: KiCad puts it on the cursor, so a second Place while the first is on its way (a double
// click, Enter twice, the row's button and the dialog's) would only replace it or fail.
async function place(p, easyeda) {
  if (!p || !p.placeable || placing) return;
  placing = p.code; syncPlace();
  const name = `<b>${esc(p.mpn)}</b>`, with3d = $('#m3d').checked;
  try {
    toast('busy', `Preparing ${name}${with3d ? ' with its 3D model' : ''}…`);
    const man = await getJSON(`/api/manifest/${p.code}?3d=${with3d ? 1 : 0}${easyeda ? '&sym=easyeda' : ''}`, {timeout: 240000});
    toast('busy', `KiCad is adding ${name} to the project's library…`);
    // KiCad 10 fails the first save into a not-yet-existing remote library; the retry finds it
    try { await rpc('PLACE_COMPONENT', man); }
    catch (e) { if (!/save the downloaded symbol/i.test(e.message)) throw e; await rpc('PLACE_COMPONENT', man); }
    const no3d = with3d && !man.assets.some(a => a.asset_type === '3dmodel');
    toast('ok', `${name} is on the cursor. Click in the schematic to put it down.`, no3d ? 'Placed without a 3D model: LCSC has none for this part, or it couldn\'t be downloaded.' : '');
    if (!matchMedia('(min-width:1040px)').matches) closeDetail();   // the dialog covers the list; docked details stay
    quiet('/api/placed/' + p.code, {method: 'POST'});  // provider makes the project's library paths relative
    getJSON('/api/close-panel', {method: 'POST'}).catch(e => {   // works once macOS allows it; say so once, not as a failure
      if (closeHint || !/System Settings/.test(e.message)) return;
      closeHint = true;
      toast('ok', `${name} is on the cursor. Click in the schematic to put it down.`, 'This window can close itself after Place: ' + esc(e.message.replace(/^.*?: /, '')));
    });
  } catch (e) {
    toast('bad', `${name} was not placed: ${esc(e.message)}`, e.kind === 'offline' || e.kind === 'timeout' ? 'Nothing was added to the schematic. Try again when LCSC can be reached.' : 'Nothing was added to the schematic.');
  }
  placing = ''; syncPlace();
}
// the result rows adapt to the width of the list (a docked panel is narrow), whatever the window's width
new ResizeObserver(es => { const w = es[0].contentRect.width, r = $('#results'); r.classList.toggle('narrow', w < 600); r.classList.toggle('tiny', w < 400); }).observe($('#results'));
// ---------------- start ----------------
// KiCad loads this page every time the panel is shown, so it starts where it was left (deep links: ?q=…&cat=<id>&f=<json>&code=C…)
(() => {
  const P = new URLSearchParams(location.search), last = !location.search && store.get('last', null);
  if (last) Object.assign(st, {q: last.q || '', catalog: last.cat || '', catName: last.catName || '', filters: last.f || {}});
  else {
    st.q = (P.get('q') || '').trim(); st.catalog = P.get('cat') || '';
    try { const f = JSON.parse(P.get('f') || '{}'); if (f && typeof f === 'object') st.filters = f; } catch (e) {}
  }
  $('#q').value = st.q; if (st.catalog && !st.catName) st.catName = catName(st.catalog);
  resetDraft(); loadCats();   // categories and the search load side by side
  const first = hasQuery() ? search() : (renderFacets(), renderList(), null);
  const code = (P.get('code') || '').toUpperCase();
  if (/^C\d+$/.test(code)) Promise.resolve(first).then(() => openDetail(byCode(code) || {code, mpn: code, manufacturer: '', package: '', url: '', prices: [], stock: 0, specs: [], placeable: true, bare: true}));
  $('#q').focus(); if (st.q) $('#q').select();   // typing replaces the last search
})();
